name: Refresh official data

on:
  schedule:
    - cron: '17 18 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/portfolio_*.json'
      - 'data/opportunity_*.json'
      - 'data/model_registry.json'
      - 'data/valuation_archetypes.json'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: elephant-data-writers-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align writer with latest main after acquiring lock
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          echo "Writer base: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check all pipelines
        run: python -m py_compile scripts/*.py

      - name: Fetch official sources and rebuild web data
        run: python scripts/update_data.py

      - name: Refresh public opportunity and security facts
        run: |
          python scripts/source_opportunity.py
          python scripts/source_security_facts.py

      - name: Build Capital Allocation OS
        run: python scripts/refresh_capital.py

      - name: Validate rebuilt data
        run: |
          python scripts/validate_data.py
          python scripts/validate_decision_scores.py
          python scripts/validate_model_validation.py
          python scripts/validate_structural_layers.py
          python scripts/test_model_validation.py
          python scripts/test_source_supplements.py
          python scripts/validate_intelligence_layer.py
          python scripts/validate_investment.py
          python scripts/test_investment_integration.py
          python scripts/build_vintage.py --validate
          python scripts/validate_decision_engine.py
          python scripts/validate_capital_allocation.py
          python scripts/test_capital_allocation.py
          python scripts/validate_calibration.py
          python scripts/validate_capital_v3.py
          python scripts/test_capital_v3.py

      - name: Commit refreshed data and heartbeat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No published data changes.'
          else
            git commit -m 'data: automated official refresh'
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Explicitly deploy refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Enforce critical source health
        run: python scripts/check_health.py

      - name: Close stale failure issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search 'Official data refresh failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment 'Automated official-data refresh is healthy again.'
          fi

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[automation] Official data refresh failed'
          number=$(gh issue list --state open --search 'Official data refresh failed in:title' --json number --jq '.[0].number // empty')
          body="Automated refresh failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
