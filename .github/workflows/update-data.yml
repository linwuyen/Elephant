name: Refresh official data

on:
  schedule:
    - cron: '17 18 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/portfolio_*.json'
      - 'data/opportunity_*.json'
      - 'data/model_registry.json'
      - 'data/valuation_archetypes.json'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: elephant-data-writers-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align writer with latest main after acquiring lock
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          echo "Writer base: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run canonical official refresh pipeline
        run: python scripts/run_official_refresh.py

      - name: Rebuild once if main advanced during computation
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Main advanced during compute: $local_sha -> $remote_sha. Discarding stale outputs and rebuilding from latest main."
            git reset --hard origin/main
            python scripts/run_official_refresh.py
          fi

      - name: Commit only if writer base is still current
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse origin/main)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Main advanced again after rebuild. Refusing to commit stale computed data."
            exit 75
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No published data changes.'
          else
            git commit -m 'data: automated official refresh'
            # Computed data is point-in-time. Never rebase a computed-data commit onto
            # a newer code/data base. A push race must fail and be recomputed later.
            git push origin HEAD:main
          fi

      - name: Explicitly deploy refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Enforce critical source health
        run: python scripts/check_health.py

      - name: Close stale failure issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search 'Official data refresh failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment 'Automated official-data refresh is healthy again.'
          fi

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[automation] Official data refresh failed'
          number=$(gh issue list --state open --search 'Official data refresh failed in:title' --json number --jq '.[0].number // empty')
          body="Automated refresh failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
