name: Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Static syntax
        run: |
          node --check app.js
          node --check investment.js
          node --check investment_v6_patch.js
          node --check personal_capital.js
          node --check research.js
          node --check decision.js
          node --check portfolio_state.js
          node --check portfolio_risk.js
          node --check intelligence.js
          node --check decision_engine.js
          node --check decision_validation.js
          node --check validation_os.js
          node --check command_center.js
          node --check scripts/test_portfolio_state_browser.js
          node --check scripts/test_portfolio_consumers.js
          node --check scripts/test_portfolio_risk.js
          python -m py_compile scripts/*.py
      - name: Rebuild derived decision intelligence in validation workspace
        run: |
          python scripts/build_decision_scores.py
          python scripts/build_validation_targets.py
          python scripts/build_ai_concentration.py
          python scripts/build_model_validation.py
          python scripts/build_structural_layers.py
          python scripts/build_intelligence_layer.py
          python scripts/build_data_quality_slo.py
          python scripts/build_point_in_time_validation.py
      - name: Refresh Alpha integration and Capital OS in validation workspace
        run: |
          python scripts/refresh_investment.py
          python scripts/refresh_capital.py
          python scripts/build_opportunity_frontier.py
      - name: Rebuild Decision Engines without mutating journal
        run: |
          python scripts/build_decision_engine.py --no-journal
          python scripts/build_decision_engine_v2.py
          python scripts/build_risk_budget_v2_availability.py
          python scripts/build_decision_attribution.py
          python scripts/build_statistical_challengers.py
          python scripts/build_validation_os_v1_3.py --no-journal
          python scripts/build_decision_command.py
          python scripts/build_model_governance.py
      - name: Validate published contracts
        run: |
          python scripts/build_validation_targets.py --check
          python scripts/validate_data.py
          python scripts/test_decision_score_math.py
          node scripts/test_portfolio_state.js
          node scripts/test_portfolio_consumers.js
          node scripts/test_portfolio_risk.js
          python scripts/validate_decision_scores.py
          python scripts/validate_model_validation.py
          python scripts/validate_structural_layers.py
          python scripts/test_model_validation.py
          python scripts/test_source_supplements.py
          python scripts/test_moea_live_tables.py
          python scripts/test_moea_dataset.py
          python scripts/test_ndc_zip_selection.py
          python scripts/test_twse_market_live.py
          python scripts/test_source_segis.py
          python scripts/test_segis_public.py
          python scripts/validate_intelligence_layer.py
          python scripts/test_source_alpha_v6.py
          python scripts/validate_investment.py
          python scripts/test_investment_integration.py
          python scripts/build_vintage.py --validate
          python scripts/validate_decision_engine.py
          python scripts/validate_decision_engine_v2.py
          python scripts/test_decision_engine_v2.py
          python scripts/validate_risk_budget_v2.py
          python scripts/test_risk_budget_v2.py
          python scripts/test_risk_budget_v2_availability.py
          python scripts/validate_validation_os.py
          python scripts/test_validation_os.py
          python scripts/validate_decision_science_v2.py
          python scripts/validate_decision_command.py
          python scripts/test_decision_command.py
          python scripts/validate_capital_allocation.py
          python scripts/test_capital_allocation.py
          python scripts/validate_calibration.py
          python scripts/validate_capital_v3.py
          python scripts/test_capital_v3.py
      - name: Browser PortfolioState migration E2E
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/elephant-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test_portfolio_state_browser.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build derived intelligence for Pages artifact
        run: |
          python scripts/build_decision_scores.py
          python scripts/build_validation_targets.py
          python scripts/build_ai_concentration.py
          python scripts/build_model_validation.py
          python scripts/build_structural_layers.py
          python scripts/build_intelligence_layer.py
          python scripts/build_data_quality_slo.py
          python scripts/build_point_in_time_validation.py
          python scripts/build_validation_targets.py --check
          python scripts/test_decision_score_math.py
          python scripts/validate_decision_scores.py
          python scripts/validate_model_validation.py
          python scripts/validate_structural_layers.py
          python scripts/test_model_validation.py
          python scripts/test_source_supplements.py
          python scripts/test_moea_live_tables.py
          python scripts/test_moea_dataset.py
          python scripts/test_ndc_zip_selection.py
          python scripts/test_twse_market_live.py
          python scripts/test_source_segis.py
          python scripts/test_segis_public.py
          python scripts/validate_intelligence_layer.py
      - name: Build latest investment, Capital OS and Decision Engine layers for Pages artifact
        run: |
          python scripts/refresh_investment.py
          python scripts/refresh_capital.py
          python scripts/build_opportunity_frontier.py
          python scripts/test_source_alpha_v6.py
          python scripts/validate_investment.py
          python scripts/validate_capital_allocation.py
          python scripts/test_capital_allocation.py
          python scripts/validate_calibration.py
          python scripts/validate_capital_v3.py
          python scripts/test_capital_v3.py
          python scripts/build_decision_engine.py --no-journal
          python scripts/build_decision_engine_v2.py
          python scripts/build_risk_budget_v2_availability.py
          python scripts/build_decision_attribution.py
          python scripts/build_statistical_challengers.py
          python scripts/build_validation_os_v1_3.py --no-journal
          python scripts/build_decision_command.py
          python scripts/build_model_governance.py
          python scripts/build_vintage.py --validate
          python scripts/validate_decision_engine.py
          python scripts/validate_decision_engine_v2.py
          python scripts/test_decision_engine_v2.py
          python scripts/validate_risk_budget_v2.py
          python scripts/test_risk_budget_v2.py
          python scripts/test_risk_budget_v2_availability.py
          python scripts/validate_validation_os.py
          python scripts/test_validation_os.py
          python scripts/validate_decision_science_v2.py
          python scripts/validate_decision_command.py
          python scripts/test_decision_command.py
          node scripts/test_portfolio_risk.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
