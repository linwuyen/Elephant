name: Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax
        run: |
          node --check app.js
          node --check investment.js
          node --check research.js
          python -m py_compile scripts/*.py
      - name: Rebuild decision data when the checked-in schema is stale
        run: |
          if ! python scripts/validate_decision_scores.py; then
            echo 'Checked-in decision data predates the current score contract; refreshing official data before validation.'
            python scripts/update_data.py
          fi
      - name: Refresh Alpha integration in validation workspace
        run: python scripts/refresh_investment.py
      - name: Validate published contracts
        run: |
          python scripts/validate_data.py
          python scripts/validate_decision_scores.py
          python scripts/validate_investment.py
          python scripts/test_investment_integration.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build latest investment layer for Pages artifact
        run: |
          python scripts/refresh_investment.py
          python scripts/validate_investment.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
