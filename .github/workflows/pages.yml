name: Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax
        run: |
          node --check app.js
          node --check investment.js
          node --check personal_capital.js
          node --check research.js
          node --check decision.js
          node --check intelligence.js
          node --check decision_engine.js
          node --check decision_validation.js
          python -m py_compile scripts/*.py
      - name: Rebuild derived decision intelligence in validation workspace
        run: |
          python scripts/build_ai_concentration.py
          python scripts/build_model_validation.py
          python scripts/build_structural_layers.py
          python scripts/build_intelligence_layer.py
      - name: Refresh Alpha integration and Capital OS in validation workspace
        run: |
          python scripts/refresh_investment.py
          python scripts/refresh_capital.py
      - name: Rebuild Decision Engine without mutating journal
        run: python scripts/build_decision_engine.py --no-journal
      - name: Validate published contracts
        run: |
          python scripts/validate_data.py
          python scripts/validate_decision_scores.py
          python scripts/validate_model_validation.py
          python scripts/validate_structural_layers.py
          python scripts/test_model_validation.py
          python scripts/test_source_supplements.py
          python scripts/test_moea_live_tables.py
          python scripts/validate_intelligence_layer.py
          python scripts/validate_investment.py
          python scripts/test_investment_integration.py
          python scripts/build_vintage.py --validate
          python scripts/validate_decision_engine.py
          python scripts/validate_capital_allocation.py
          python scripts/test_capital_allocation.py
          python scripts/validate_calibration.py
          python scripts/validate_capital_v3.py
          python scripts/test_capital_v3.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build derived intelligence for Pages artifact
        run: |
          python scripts/build_ai_concentration.py
          python scripts/build_model_validation.py
          python scripts/build_structural_layers.py
          python scripts/build_intelligence_layer.py
          python scripts/validate_decision_scores.py
          python scripts/validate_model_validation.py
          python scripts/validate_structural_layers.py
          python scripts/test_model_validation.py
          python scripts/test_source_supplements.py
          python scripts/test_moea_live_tables.py
          python scripts/validate_intelligence_layer.py
      - name: Build latest investment, Capital OS and Decision Engine layers for Pages artifact
        run: |
          python scripts/refresh_investment.py
          python scripts/refresh_capital.py
          python scripts/validate_investment.py
          python scripts/validate_capital_allocation.py
          python scripts/test_capital_allocation.py
          python scripts/validate_calibration.py
          python scripts/validate_capital_v3.py
          python scripts/test_capital_v3.py
          python scripts/build_decision_engine.py --no-journal
          python scripts/build_vintage.py --validate
          python scripts/validate_decision_engine.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
