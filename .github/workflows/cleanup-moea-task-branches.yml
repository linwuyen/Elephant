name: One-shot MOEA task branch cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-moea-task-branches.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Delete completed task branches
        run: |
          git push origin --delete \
            agent/fix-moea-production-contract \
            agent/remove-obsolete-moea-supplement \
            ci/modern-moea-source-smoke \
            ci/smoke-moea-datagov
      - name: Remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-moea-task-branches.yml
          git commit -m 'chore: remove one-shot MOEA branch cleanup'
          git push
