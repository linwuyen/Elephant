name: Refresh consultant research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # 10:17 Asia/Taipei, after Consultant_System 09:17 refresh
  push:
    branches: [main]
    paths:
      - 'scripts/sync_consultant_research.py'
      - 'scripts/build_intelligence_layer.py'
      - 'scripts/build_ai_concentration.py'
      - 'scripts/build_decision_engine.py'
      - 'scripts/validate_intelligence_layer.py'
      - '.github/workflows/update-research.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: elephant-data-writers-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align writer with latest main after acquiring lock
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard origin/main
          echo "Writer base: $(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Consultant_System artifacts
        run: python scripts/sync_consultant_research.py

      - name: Verify synced SQLite and research contract
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          status = json.loads(Path('data/consultant/status.json').read_text(encoding='utf-8'))
          assert status['status'] == 'ok'
          assert status['coverage_complete'] is True
          assert status['score_influence'] is False
          assert status['reports'] >= 10
          companies = status.get('companies') or {}
          assert all(companies.get(c, 0) >= 3 for c in ('McKinsey','BCG','Deloitte','PwC')), companies

          con = sqlite3.connect('data/consultant/consultant.db')
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'reports', 'topics', 'report_topics', 'sources', 'meta'} <= tables
          rows = con.execute('SELECT COUNT(*) FROM reports').fetchone()[0]
          assert rows == status['reports'], (rows, status['reports'])
          con.close()
          print('Consultant research integration PASS:', status['reports'], 'reports', companies)
          PY

      - name: Rebuild cross-source intelligence and research claims
        shell: bash
        run: |
          journal_before=$(sha256sum data/decision_journal.json | awk '{print $1}')
          python scripts/build_ai_concentration.py
          python scripts/build_intelligence_layer.py
          python scripts/build_decision_engine.py --no-journal
          # Research-only refreshes may rebuild derived context but are not allowed
          # to mutate the prospective decision journal.
          git restore -- data/decision_journal.json
          journal_after=$(sha256sum data/decision_journal.json | awk '{print $1}')
          test "$journal_before" = "$journal_after"
          python scripts/validate_decision_scores.py
          python scripts/validate_intelligence_layer.py

      - name: Commit synced research snapshot and intelligence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/consultant/ data/intelligence_layer.json data/decision_scores.json data/summary.json data/research_claims.json data/forecast.json data/risk_budget.json data/decision_engine.json
          if git diff --cached --quiet; then
            echo 'No research or intelligence changes.'
            exit 0
          fi
          git commit -m 'data: sync consultant research and decision intelligence'
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main

      - name: Deploy refreshed research
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
